org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Где лежат материалы (collections/, audio/, grammar/). По умолчанию — папка над проектом.
albion.contentDir=..
# true (по умолчанию) — вшить материалы в APK (assets/content): после установки всё работает сразу.
# false — собрать «пустое» приложение (быстрее для экспериментов с кодом).
albion.bundleContent=true
